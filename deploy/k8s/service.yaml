apiVersion: v1
kind: Service
metadata:
  name: symphony
  labels:
    app: symphony
spec:
  type: ClusterIP
  selector:
    app: symphony
  ports:
  - name: http
    port: 4000
    targetPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: symphony-headless
  labels:
    app: symphony
spec:
  clusterIP: None
  selector:
    app: symphony
  ports:
  - name: epmd
    port: 4369
    targetPort: 4369
  - name: erlang-dist
    port: 9100
    targetPort: 9100
