apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: symphony
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: symphony
  minReplicas: 1
  maxReplicas: 20
  metrics:
  # Use CPU utilization as the primary scaling signal (Symphony agents are CPU+IO bound).
  # Replace with a custom symphony_running_ratio metric once BUB-206 exposes it via /metrics.
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Pods
        value: 2
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
