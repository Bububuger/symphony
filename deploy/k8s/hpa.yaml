apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: symphony
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: symphony
  minReplicas: 1
  maxReplicas: 20
  metrics:
  - type: Pods
    pods:
      metric:
        name: symphony_running_ratio
      target:
        type: AverageValue
        averageValue: "800m"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Pods
        value: 2
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
